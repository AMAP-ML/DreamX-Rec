<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">DreamX-Rec — Generative Recommendation System Architecture</title>
<desc id="desc">Reference architecture connecting IntTravel data, IntSR request semantics, IntHQ task modeling, IntRR item representation and decoding, IntBMoE compute, and forthcoming IntLID retrieval-ranking integration. Offline training and online feedback complete the system.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
